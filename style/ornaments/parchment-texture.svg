<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Tileable, very low-contrast paper fibre/mottle. Used under a flat parchment colour. -->
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="7" stitchTiles="stitch" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.45  0 0 0 0 0.22  0 0 0 0.9 -0.32"/>
  </filter>
  <rect width="400" height="400" filter="url(#n)" opacity="0.2"/>
</svg>
